<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prabhat Bhattarai — BIT Student & Developer</title>
  <style>
    :root {
      --bg: #090a0f;
      --surface: #12151e;
      --surface-border: #1f2433;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .typewriter-container {
      font-size: 1.2rem;
      color: var(--text-muted);
      height: 1.8rem;
    }

    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.2rem;
      background-color: var(--accent-blue);
      margin-left: 2px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    section {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--accent-purple);
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 0.5rem;
    }

    /* Skills Progress Bars */
    .skill-row {
      margin-bottom: 1rem;
    }

    .skill-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    .bar-bg {
      background: var(--surface-border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
      width: 0%;
      transition: width 1.2s ease-out;
    }

    /* Live GitHub Activity Image */
    .github-card {
      background: #0d1117;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 1.5rem;
      overflow-x: auto;
      text-align: center;
    }

    .github-card img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Scroll Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Prabhat Bhattarai</h1>
      <div class="typewriter-container">
        <span id="typeTarget"></span><span class="typewriter-cursor"></span>
      </div>
    </header>

    <section class="reveal">
      <h2>About Me</h2>
      <p>Passionate about web development, cyber security, and building modern web experiences. Currently pursuing BIT at Bagmati University (Janamaitri Campus) in Kathmandu, Nepal.</p>
    </section>

    <section class="reveal" data-skills>
      <h2>Skills</h2>
      <div class="skill-row" data-level="85">
        <div class="skill-info"><span>HTML & CSS</span><span>85%</span></div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
      </div>
      <div class="skill-row" data-level="70">
        <div class="skill-info"><span>JavaScript</span><span>70%</span></div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
      </div>
      <div class="skill-row" data-level="65">
        <div class="skill-info"><span>Cybersecurity Fundamentals</span><span>65%</span></div>
        <div class="bar-bg"><div class="bar-fill"></div></div>
      </div>
    </section>

    <section class="reveal">
      <h2>GitHub Activity</h2>
      <div class="github-card">
        <img src="https://ghchart.rshah.org/3b82f6/prabhatbhattarai11" alt="Prabhat's GitHub Contributions Graph" />
      </div>
    </section>
  </div>

  <script>
    // Typing Effect
    const words = ["BIT Student", "Web Developer", "Cybersecurity Enthusiast", "AI Learner"];
    let wordIdx = 0; let charIdx = 0; let isDeleting = false;
    const target = document.getElementById("typeTarget");

    function type() {
      const currentWord = words[wordIdx];
      if (isDeleting) {
        target.textContent = currentWord.substring(0, charIdx - 1);
        charIdx--;
      } else {
        target.textContent = currentWord.substring(0, charIdx + 1);
        charIdx++;
      }

      let typeSpeed = isDeleting ? 40 : 80;

      if (!isDeleting && charIdx === currentWord.length) {
        typeSpeed = 2000; isDeleting = true;
      } else if (isDeleting && charIdx === 0) {
        isDeleting = false; wordIdx = (wordIdx + 1) % words.length; typeSpeed = 500;
      }

      setTimeout(type, typeSpeed);
    }
    document.addEventListener("DOMContentLoaded", type);

    // Scroll Reveal Animations & Skill Bars Trigger
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          if (entry.target.hasAttribute('data-skills')) {
            entry.target.querySelectorAll('.skill-row').forEach(row => {
              const level = row.getAttribute('data-level');
              row.querySelector('.bar-fill').style.width = level + '%';
            });
          }
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
